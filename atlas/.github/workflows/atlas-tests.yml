name: Atlas tests
on:
  push:
    paths:
      - 'atlas/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas/package.json
      - run: npm install --ignore-scripts
      - run: npm test
